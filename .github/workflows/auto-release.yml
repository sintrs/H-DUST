name: Auto release (upstream nightly + offline launcher)

# 游戏本体不编译：直接复制官方 nightly 包。
# 启动器用上游最新源码：反向合并 1e789800af 恢复离线名字，再打 H-RUST 补丁。
# 版本号直接沿用上游 nightly-YYYY-MM-DD-xxxxxxx，不向上游提 PR。

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略 state，按当前上游 nightly 强制重建一次'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: h-rust-auto-release
  cancel-in-progress: false

jobs:
  monitor:
    name: Check upstream version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      nightly_commit: ${{ steps.check.outputs.nightly_commit }}
      game_ref: ${{ steps.check.outputs.game_ref }}
      version_tag: ${{ steps.check.outputs.version_tag }}
      launcher_version: ${{ steps.check.outputs.launcher_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare with stored upstream version
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ "${FORCE}" == "true" ]]; then
            python3 tools/ci/monitor_upstream.py --state state/upstream.json --force
          else
            python3 tools/ci/monitor_upstream.py --state state/upstream.json
          fi

      - name: Commit the new state
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/upstream.json
          git commit -m "chore: track upstream ${{ steps.check.outputs.version_tag }}"
          git push

  build:
    name: Patch launcher and publish
    needs: monitor
    if: needs.monitor.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GAME_REF: ${{ needs.monitor.outputs.game_ref }}
      VERSION_TAG: ${{ needs.monitor.outputs.version_tag }}
      NIGHTLY_COMMIT: ${{ needs.monitor.outputs.nightly_commit }}
      LAUNCHER_VERSION: ${{ needs.monitor.outputs.launcher_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to overwrite an existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION_TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${VERSION_TAG} already exists; nothing was overwritten"
            exit 1
          fi

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config jq \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev \
            libfontconfig1-dev libvulkan-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Clone upstream source with full history
        run: |
          set -euo pipefail
          git clone --no-tags https://github.com/horizon-rust/horizon.git launcher-src
          git -C launcher-src checkout "${GAME_REF}"
          echo "source: $(git -C launcher-src log -1 --format='%h %ad %s' --date=short)"

      - name: Revert the commit that removed offline names
        run: |
          set -euo pipefail
          cd launcher-src
          git revert --no-commit 1e789800af || true
          # Conflicts: take the pre-removal (theirs) side. Most are language files.
          git diff --name-only --diff-filter=U -z | xargs -0 -r git checkout --theirs --
          git add -A
          git revert --quit || true
          grep -q 'offline_selected' launcher/src/account.rs \
            || { echo '::error::offline names were not restored'; exit 1; }
          grep -q 'dev_offline' launcher/src/backend.rs \
            || { echo '::error::dev_offline was not restored'; exit 1; }

      - name: Apply H-RUST offline defaults
        run: python3 tools/ci/patch_launcher_offline.py launcher-src

      - name: Build launcher only
        run: bash tools/ci/build-linux.sh launcher-src dist launcher

      - name: Check the skeleton nightly still matches the pinned commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/horizon-rust/horizon/releases/tags/nightly \
            | jq -r '.body' > upstream-nightly.txt
          grep -q "${NIGHTLY_COMMIT}" upstream-nightly.txt \
            || { echo '::error::upstream nightly moved during the build; retry next run'; exit 1; }

      - name: Put our launcher into the untouched upstream package
        run: |
          bash tools/ci/make-linux-package.sh dist package \
            "https://github.com/horizon-rust/horizon/releases/download/nightly/horizon-linux-x86_64.tar.gz"

      - name: Create release notes
        run: |
          set -euo pipefail
          {
            echo "Version copied verbatim from upstream: \`${VERSION_TAG}\`"
            echo
            echo "| Part | Source |"
            echo "|---|---|"
            echo "| Game binaries | upstream nightly package, **copied unchanged** (no rebuild) |"
            echo "| Launcher | upstream source \`${GAME_REF}\` + reverse merge of \`1e789800af\` + H-RUST offline defaults |"
            echo
            echo "The launcher can play with an offline name and no Microsoft account."
            echo "Run with \`HORIZON_LAUNCHER_NO_SELF_UPDATE=1\`; self-update is also disabled at build time."
          } > release-notes.md

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET=$(find package -maxdepth 1 -name '*.tar.gz' | head -1)
          [[ -n "$ASSET" ]] || { echo '::error::no package produced'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"
          gh release create "$VERSION_TAG" "$ASSET" \
            --title "Horizon offline · $VERSION_TAG" \
            --notes-file release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-offline-${{ env.VERSION_TAG }}
          path: package/
          retention-days: 14
          if-no-files-found: error
