name: Auto release (copy upstream nightly version)

# 监控 horizon-rust/horizon 的 nightly + launcher 版本。
# 发现上游换了 nightly，就用同一个版本号（nightly-YYYY-MM-DD-xxxxxxx）构建并发 release。
# 游戏源码钉在上游不可变的 nightly-source tag；启动器仍用 gerdaroot 的离线分支。
# 本仓库不向上游提任何合并，也不修改上游源码。

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略 state，按当前上游 nightly 强制重建一次'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: h-rust-auto-release
  cancel-in-progress: false

jobs:
  monitor:
    name: Check upstream version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      nightly_date: ${{ steps.check.outputs.nightly_date }}
      nightly_commit: ${{ steps.check.outputs.nightly_commit }}
      nightly_short: ${{ steps.check.outputs.nightly_short }}
      game_ref: ${{ steps.check.outputs.game_ref }}
      version_tag: ${{ steps.check.outputs.version_tag }}
      launcher_version: ${{ steps.check.outputs.launcher_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare with stored upstream version
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ "${FORCE}" == "true" ]]; then
            python3 tools/ci/monitor_upstream.py --state state/upstream.json --force
          else
            python3 tools/ci/monitor_upstream.py --state state/upstream.json
          fi

      - name: Commit the new state
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/upstream.json
          git commit -m "chore: track upstream ${{ steps.check.outputs.version_tag }}"
          git push

  build:
    name: Build and publish
    needs: monitor
    if: needs.monitor.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      GAME_REF: ${{ needs.monitor.outputs.game_ref }}
      VERSION_TAG: ${{ needs.monitor.outputs.version_tag }}
      NIGHTLY_COMMIT: ${{ needs.monitor.outputs.nightly_commit }}
      LAUNCHER_VERSION: ${{ needs.monitor.outputs.launcher_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to overwrite an existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION_TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${VERSION_TAG} already exists; nothing was overwritten"
            exit 1
          fi

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config jq \
            libasound2-dev libudev-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev \
            libfontconfig1-dev libvulkan-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Get pinned upstream game source
        run: |
          set -euo pipefail
          git clone --depth 1 --no-tags --branch "${GAME_REF}" \
            https://github.com/horizon-rust/horizon.git game-src \
            || { git clone --no-tags https://github.com/horizon-rust/horizon.git game-src \
                 && git -C game-src checkout "${GAME_REF}"; }
          echo "game: $(git -C game-src log -1 --format='%h %ad %s' --date=short)"
          echo "HORIZON_GAME_BUILD_ID=$(git -C game-src rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Get offline launcher source
        run: |
          set -euo pipefail
          git clone --depth 1 --no-tags \
            https://github.com/gerdaroot/Horizon-Offline-Launcher.git launcher-src
          echo "launcher: $(git -C launcher-src log -1 --format='%h %ad %s' --date=short)"
          grep -q 'GATE_OPEN: bool = true' launcher-src/launcher/src/account.rs \
            || { echo '::error::launcher source lost GATE_OPEN = true'; exit 1; }

      - name: Build launcher
        run: bash tools/ci/build-linux.sh launcher-src dist launcher

      - name: Build game binaries
        run: bash tools/ci/build-linux.sh game-src dist game

      - name: Check the skeleton nightly still matches the pinned commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/horizon-rust/horizon/releases/tags/nightly \
            | jq -r '.body' > upstream-nightly.txt
          grep -q "${NIGHTLY_COMMIT}" upstream-nightly.txt \
            || { echo '::error::upstream nightly moved during the build; retry next run'; exit 1; }

      - name: Package with official nightly skeleton
        run: |
          bash tools/ci/make-linux-package.sh dist package \
            "https://github.com/horizon-rust/horizon/releases/download/nightly/horizon-linux-x86_64.tar.gz"

      - name: Create release notes
        run: |
          set -euo pipefail
          {
            echo "Version copied verbatim from upstream: \`${VERSION_TAG}\`"
            echo
            echo "| Part | Source |"
            echo "|---|---|"
            echo "| Game | \`horizon-rust/horizon\` @ \`${GAME_REF}\` |"
            echo "| Launcher | \`gerdaroot/Horizon-Offline-Launcher\` @ \`$(git -C launcher-src rev-parse HEAD)\` |"
            echo "| Upstream launcher | ${LAUNCHER_VERSION} (informational; offline launcher keeps its own numbering) |"
            echo
            echo "Install: \`tar -xzf horizon-linux-x86_64-offline.tar.gz\` then"
            echo "\`bash tools/ci/install-version-offline.sh ./horizon-linux-x86_64 nightly\`."
            echo
            echo "Run with \`HORIZON_LAUNCHER_NO_SELF_UPDATE=1\` so this build is not replaced by a signed upstream one."
          } > release-notes.md

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET=$(find package -maxdepth 1 -name '*.tar.gz' | head -1)
          [[ -n "$ASSET" ]] || { echo '::error::no package produced'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"
          gh release create "$VERSION_TAG" "$ASSET" \
            --title "Horizon offline · $VERSION_TAG" \
            --notes-file release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-offline-${{ env.VERSION_TAG }}
          path: package/
          retention-days: 14
          if-no-files-found: error
