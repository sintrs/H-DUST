name: Build Linux (upstream nightly + offline launcher)

# 手动触发：Actions → 这个 workflow → Run workflow。产物在本次运行的 Artifacts 里。
#
# 这个仓库不托管 Horizon 的源码：workflow 自己去公开仓库克隆，编完只上传二进制。
# 仓库里只需要 tools/ci/ 的几个脚本 + 这一个 workflow 文件。
#
# 两路源码：
#   · 游戏本体用 horizon-rust/horizon（真上游，每次现场 clone 默认分支 = 当天最新）；
#   · 启动器用 gerdaroot 的离线分支 —— 上游 0.2.79 起删掉了离线身份
#     (launcher: remove offline names; play only as an account that owns the game)，
#     没有正版账号就进不去；离线分支保留 account::GATE_OPEN = true，可以无账号开局。
#
# 产物：glibc >= 2.35 的机器可直接跑（与上游官方包同档）。
# 不再编 glibc 2.28 版本 —— Debian 10 容器那一层已移除。

on:
  workflow_dispatch:
    inputs:
      game_repo:
        description: '游戏源码（默认真上游）'
        required: false
        default: horizon-rust/horizon
        type: string
      game_ref:
        description: '游戏源码的分支/tag/commit（留空 = 默认分支最新）'
        required: false
        default: ''
        type: string
      launcher_repo:
        description: '启动器源码（默认带离线门禁的 fork）'
        required: false
        default: gerdaroot/Horizon-Offline-Launcher
        type: string
      targets:
        description: '编译哪些目标'
        required: false
        default: both
        type: choice
        options: [both, launcher, game]
      target_cpu:
        description: 'CPU 基线：x86-64（通用）/ x86-64-v2 / x86-64-v3（AVX2）'
        required: false
        default: x86-64
        type: choice
        options: [x86-64, x86-64-v2, x86-64-v3]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: 腾出磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: 系统依赖（ALSA / udev 头文件，上游 linux job 同款）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: 取游戏源码
        if: inputs.targets != 'launcher'
        run: |
          REF="${{ inputs.game_ref }}"
          if [[ -n "$REF" ]]; then
            git clone --depth 1 --no-tags --branch "$REF" "https://github.com/${{ inputs.game_repo }}.git" game-src \
              || { git clone --no-tags "https://github.com/${{ inputs.game_repo }}.git" game-src && git -C game-src checkout "$REF"; }
          else
            git clone --depth 1 --no-tags "https://github.com/${{ inputs.game_repo }}.git" game-src
          fi
          echo "游戏源码：$(git -C game-src log -1 --format='%h %ad %s' --date=short)"
          echo "工作树：$(du -sh game-src | cut -f1)"
          # 构建身份：crates/horizon-mod-host/build.rs 要一个 commit 号，没给就自己跑
          # `git rev-parse HEAD` 并断言成功；有它就完全不碰 git（上游 staged build 的正规入口）。
          echo "HORIZON_GAME_BUILD_ID=$(git -C game-src rev-parse HEAD)" >> "$GITHUB_ENV"
          if [[ -d game-src/crates/horizon-official ]]; then
            echo "布局：upstream（游戏入口 horizon-official → 打包时改名 horizon-client）"
          else
            echo "布局：legacy（游戏入口直接是 horizon-client）"
          fi

      - name: 取启动器源码
        if: inputs.targets != 'game'
        run: |
          git clone --depth 1 --no-tags "https://github.com/${{ inputs.launcher_repo }}.git" launcher-src
          echo "启动器源码：$(git -C launcher-src log -1 --format='%h %ad %s' --date=short)"
          if [[ -z "${HORIZON_GAME_BUILD_ID:-}" ]]; then
            echo "HORIZON_GAME_BUILD_ID=$(git -C launcher-src rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
          # 离线门禁自检：这个常量决定"没有正版账号能不能开局"
          if grep -rq 'GATE_OPEN: bool = true' launcher-src/launcher/src/account.rs 2>/dev/null; then
            echo "离线门禁：开启（GATE_OPEN = true）"
          else
            echo "::warning::启动器源码里没有 GATE_OPEN = true，没有正版账号将无法开局"
          fi

      - name: 编译启动器
        if: inputs.targets != 'game'
        env:
          RUSTFLAGS: -C target-cpu=${{ inputs.target_cpu }}
        run: bash tools/ci/build-linux.sh launcher-src dist launcher

      - name: 编译游戏二进制（client / ctl / prepare / server + wasm-std）
        if: inputs.targets != 'launcher'
        env:
          RUSTFLAGS: -C target-cpu=${{ inputs.target_cpu }}
        run: bash tools/ci/build-linux.sh game-src dist game

      - name: 装进官方 nightly 包（骨架 + 我们编的二进制）
        if: inputs.targets != 'launcher'
        run: |
          bash tools/ci/make-linux-package.sh dist package \
            "https://github.com/horizon-rust/horizon/releases/download/nightly/horizon-linux-x86_64.tar.gz"

      - name: 汇总结果
        if: always()
        run: |
          {
            echo "## 产物"
            echo
            echo "| 文件 | glibc 地板 | 大小 |"
            echo "|---|---|---|"
            for f in dist/* package/*.tar.gz; do
              [[ -f "$f" ]] || continue
              case "$f" in
                *.tar.gz) echo "| \`$(basename "$f")\` | — | $(du -h "$f" | cut -f1) |"; continue ;;
              esac
              v=$(objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
              echo "| \`$(basename "$f")\` | ${v:-非 ELF} | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "游戏源码：\`${{ inputs.game_repo }}\` @ \`${{ inputs.game_ref || 'default' }}\` · 启动器：\`${{ inputs.launcher_repo }}\`"
            echo
            echo "CPU 基线：\`${{ inputs.target_cpu }}\`。"
            echo
            echo "> 组合提醒：上游最新游戏 + 离线 fork 启动器可能撞上 cache lease 契约"
            echo "> （报 \`cannot acquire launcher cache leases / unregistered cache directories\`）。"
            echo "> 真撞上了，把 \`game_ref\` 填成与该启动器配套的那个 nightly 日期再编一次。"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-linux-${{ inputs.target_cpu }}
          path: |
            dist/
            package/
          if-no-files-found: error
          retention-days: 30
