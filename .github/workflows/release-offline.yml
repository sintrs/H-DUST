name: Release offline (official launcher + official game)

# 出「离线」：不编译任何东西。
# - 官方最新启动器 launcher@X.Y.Z（Linux tar.gz）
# - 官方 nightly 游戏包（原样）
# - 把游戏装成 developer-<commit> 版本，开启上游内建的单人离线模式
#
# 依据（已实测）：上游 launcher/src/developer_offline.rs 的开关条件只有
#   版本目录名以 developer- 开头 + .installed + developer.json(40 位 revision)，
# 且官方 horizon-client --launch-api 里列出 --developer-single-player。
# 所以用官方启动器 + 官方游戏就能离线单人开局，无需改一行 Rust。
on:
  schedule:
    - cron: '*/35 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略 state，按当前上游 nightly 强制重建一次'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: h-rust-release-offline
  cancel-in-progress: false

jobs:
  monitor:
    name: Check upstream nightly
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      nightly_commit: ${{ steps.check.outputs.nightly_commit }}
      version_tag: ${{ steps.check.outputs.version_tag }}
      launcher_version: ${{ steps.check.outputs.launcher_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare with stored upstream version
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ "${FORCE}" == "true" ]]; then
            python3 tools/ci/monitor_upstream.py --state state/offline.json --force
          else
            python3 tools/ci/monitor_upstream.py --state state/offline.json
          fi

      - name: Commit the new state
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/offline.json
          git commit -m "chore: track upstream offline ${{ steps.check.outputs.version_tag }}"
          git pull --rebase origin main
          git push

  publish:
    name: Assemble offline package
    needs: monitor
    if: needs.monitor.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VERSION_TAG: ${{ needs.monitor.outputs.version_tag }}-offline
      NIGHTLY_COMMIT: ${{ needs.monitor.outputs.nightly_commit }}
      LAUNCHER_VERSION: ${{ needs.monitor.outputs.launcher_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to overwrite an existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION_TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${VERSION_TAG} already exists; nothing was overwritten"
            exit 1
          fi

      - name: Download official launcher and game
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${LAUNCHER_VERSION}" ]] || { echo '::error::no launcher@X.Y.Z release found'; exit 1; }
          curl -fsSL --retry 3 -o launcher.tar.gz \
            "https://github.com/horizon-rust/horizon/releases/download/${LAUNCHER_VERSION}/horizon-launcher-linux-x86_64.tar.gz"
          curl -fsSL --retry 3 -o game.tar.gz \
            'https://github.com/horizon-rust/horizon/releases/download/nightly/horizon-linux-x86_64.tar.gz'
          ls -lh launcher.tar.gz game.tar.gz

      - name: Verify nightly still matches the pinned commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/horizon-rust/horizon/releases/tags/nightly \
            | jq -r '.body' > upstream-nightly.txt
          grep -q "${NIGHTLY_COMMIT}" upstream-nightly.txt \
            || { echo '::error::upstream nightly moved during the build; retry next run'; exit 1; }

      - name: Assemble the offline package
        run: bash tools/ci/make-offline-package.sh launcher.tar.gz game.tar.gz "${NIGHTLY_COMMIT}" package

      - name: Check the official client advertises offline single-player
        run: |
          set -euo pipefail
          CLIENT=$(find package -maxdepth 4 -type f -name 'horizon-client' | head -1)
          chmod +x "$CLIENT"
          "$CLIENT" --launch-api | grep -q -- '--developer-single-player' \
            || { echo '::error::this client no longer supports offline single-player'; exit 1; }

      - name: Create release notes
        run: |
          set -euo pipefail
          {
            echo "Nothing is rebuilt: the official launcher and the official game are copied as-is."
            echo
            echo "| Part | Source |"
            echo "|---|---|"
            echo "| Launcher | official \`${LAUNCHER_VERSION}\` Linux build |"
            echo "| Game | official nightly \`${NIGHTLY_COMMIT:0:7}\`, copied verbatim |"
            echo "| Offline | the game is installed as a \`developer-\` version, which enables the upstream single-player offline mode |"
            echo
            echo "Run \`./run-offline.sh\`. Single-player only; LAN and servers are refused by the upstream design."
          } > release-notes-offline.md

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET=$(find package -maxdepth 1 -name '*.tar.gz' | head -1)
          [[ -n "$ASSET" ]] || { echo '::error::no package produced'; exit 1; }
          gh release create "$VERSION_TAG" "$ASSET" \
            --title "Horizon offline · $VERSION_TAG" \
            --notes-file release-notes-offline.md

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-offline-${{ env.VERSION_TAG }}
          path: package/
          retention-days: 14
          if-no-files-found: error
