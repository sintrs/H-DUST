name: Release offline (offline launcher + upstream game)

# 出「离线」：游戏本体复制上游 nightly 官方包，启动器用已验证可编译的
# gerdaroot/Horizon-Offline-Launcher 源码（GATE_OPEN=true，允许离线开局）。
# 与 release-game.yml 完全独立：独立 state、独立 tag 后缀 -offline。
on:
  schedule:
    - cron: '*/35 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略 state，按当前上游 nightly 强制重建一次'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: h-rust-release-offline
  cancel-in-progress: false

jobs:
  monitor:
    name: Check upstream nightly
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      nightly_commit: ${{ steps.check.outputs.nightly_commit }}
      game_ref: ${{ steps.check.outputs.game_ref }}
      version_tag: ${{ steps.check.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare with stored upstream version
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ "${FORCE}" == "true" ]]; then
            python3 tools/ci/monitor_upstream.py --state state/offline.json --force
          else
            python3 tools/ci/monitor_upstream.py --state state/offline.json
          fi

      - name: Commit the new state
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/offline.json
          git commit -m "chore: track upstream offline ${{ steps.check.outputs.version_tag }}"
          git pull --rebase origin main
          git push

  build:
    name: Build offline launcher and publish
    needs: monitor
    if: needs.monitor.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      VERSION_TAG: ${{ needs.monitor.outputs.version_tag }}-offline
      NIGHTLY_COMMIT: ${{ needs.monitor.outputs.nightly_commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to overwrite an existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION_TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${VERSION_TAG} already exists; nothing was overwritten"
            exit 1
          fi

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config jq \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev \
            libfontconfig1-dev libvulkan-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Clone offline launcher source
        run: |
          set -euo pipefail
          git clone https://github.com/gerdaroot/Horizon-Offline-Launcher.git launcher-src
          echo "launcher: $(git -C launcher-src log -1 --format='%h %ad %s' --date=short)"
          grep -q 'GATE_OPEN: bool = true' launcher-src/launcher/src/account.rs \
            || { echo '::error::offline gate is not open in the launcher source'; exit 1; }

      - name: Build launcher only
        run: bash tools/ci/build-linux.sh launcher-src dist launcher

      - name: Verify nightly still matches the pinned commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/horizon-rust/horizon/releases/tags/nightly \
            | jq -r '.body' > upstream-nightly.txt
          grep -q "${NIGHTLY_COMMIT}" upstream-nightly.txt \
            || { echo '::error::upstream nightly moved during the build; retry next run'; exit 1; }

      - name: Put our launcher into the untouched upstream package
        run: |
          bash tools/ci/make-linux-package.sh dist package \
            "https://github.com/horizon-rust/horizon/releases/download/nightly/horizon-linux-x86_64.tar.gz"

      - name: Create release notes
        run: |
          set -euo pipefail
          {
            echo "Offline launcher build based on upstream nightly \`${NIGHTLY_COMMIT}\`."
            echo
            echo "| Part | Source |"
            echo "|---|---|"
            echo "| Game binaries | upstream nightly package, copied unchanged |"
            echo "| Launcher | gerdaroot/Horizon-Offline-Launcher, \`GATE_OPEN=true\` |"
            echo
            echo "Runs with \`HORIZON_LAUNCHER_NO_SELF_UPDATE=1\` to avoid being replaced by a signed update."
          } > release-notes-offline.md

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET=$(find package -maxdepth 1 -name '*.tar.gz' | head -1)
          [[ -n "$ASSET" ]] || { echo '::error::no package produced'; exit 1; }
          gh release create "$VERSION_TAG" "$ASSET" \
            --title "Horizon offline · $VERSION_TAG" \
            --notes-file release-notes-offline.md

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-offline-${{ env.VERSION_TAG }}
          path: package/
          retention-days: 14
          if-no-files-found: error
