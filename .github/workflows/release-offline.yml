name: Release offline (offline launcher + official game)

# 出「离线」包：离线名可在界面里改，单人、多人、LAN 都能用。
# - 游戏本体：官方 nightly 包**原样复制**，不编译
# - 启动器：从同一 nightly 的**上游源码**编译，然后打 offline-port.patch：
#   把上游 11 月删掉的离线账号体系（离线名、无拥有者可玩）移植回来。
#
# 与 gerdaroot 的做法一致（他也是把离线账号层放回启动器），但我们跟着上游走：
# 补丁以 tools/ci/offline-port.patch 的形式存在，上游一变就在 CI 里三方重放。
on:
  schedule:
    - cron: '*/35 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略 state，按当前上游 nightly 强制重建一次'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: h-rust-release-offline
  cancel-in-progress: false

jobs:
  monitor:
    name: Check upstream nightly
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      nightly_commit: ${{ steps.check.outputs.nightly_commit }}
      version_tag: ${{ steps.check.outputs.version_tag }}
      launcher_version: ${{ steps.check.outputs.launcher_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare with stored upstream version
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ "${FORCE}" == "true" ]]; then
            python3 tools/ci/monitor_upstream.py --state state/offline.json --force
          else
            python3 tools/ci/monitor_upstream.py --state state/offline.json
          fi

      - name: Commit the new state
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/offline.json
          git commit -m "chore: track upstream offline ${{ steps.check.outputs.version_tag }}"
          git pull --rebase origin main
          git push

  publish:
    name: Build offline launcher and publish
    needs: monitor
    if: needs.monitor.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION_TAG: ${{ needs.monitor.outputs.version_tag }}-offline
      NIGHTLY_COMMIT: ${{ needs.monitor.outputs.nightly_commit }}
      LAUNCHER_VERSION: ${{ needs.monitor.outputs.launcher_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to overwrite an existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION_TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${VERSION_TAG} already exists; nothing was overwritten"
            exit 1
          fi

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install launcher build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev patchelf

      - name: Clone the pinned upstream source
        run: |
          set -euo pipefail
          git init -q src
          git -C src remote add origin https://github.com/horizon-rust/horizon.git
          git -C src fetch -q --depth 1 origin "${NIGHTLY_COMMIT}"
          git -C src checkout -q FETCH_HEAD
          echo "source HEAD: $(git -C src rev-parse HEAD)"

      - name: Port the offline account layer onto this source
        run: |
          set -euo pipefail
          git -C src apply --stat ../tools/ci/offline-port.patch
          git -C src apply ../tools/ci/offline-port.patch
          echo "offline-port.patch applied to $(git -C src rev-parse --short HEAD)"

      - name: Build the launcher
        env:
          HORIZON_GAME_BUILD_ID: ${{ needs.monitor.outputs.nightly_commit }}
        run: |
          set -euo pipefail
          bash tools/ci/build-linux.sh src dist launcher
          test -x dist/horizon-launcher || { echo '::error::launcher binary missing'; exit 1; }
          dist/horizon-launcher --version || true

      - name: Download the official game package
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o launcher.tar.gz \
            "https://github.com/horizon-rust/horizon/releases/download/${LAUNCHER_VERSION}/horizon-launcher-linux-x86_64.tar.gz"
          curl -fsSL --retry 3 -o game.tar.gz \
            'https://github.com/horizon-rust/horizon/releases/download/nightly/horizon-linux-x86_64.tar.gz'
          ls -lh launcher.tar.gz game.tar.gz dist/horizon-launcher

      - name: Verify nightly still matches the pinned commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/horizon-rust/horizon/releases/tags/nightly \
            | jq -r '.body' > upstream-nightly.txt
          grep -q "${NIGHTLY_COMMIT}" upstream-nightly.txt \
            || { echo '::error::upstream nightly moved during the build; retry next run'; exit 1; }

      - name: Assemble the offline package
        run: |
          set -euo pipefail
          bash tools/ci/make-offline-package.sh \
            launcher.tar.gz game.tar.gz "${NIGHTLY_COMMIT}" package dist/horizon-launcher \
            "${VERSION_TAG%-offline}"

      - name: Create release notes
        run: |
          set -euo pipefail
          {
            echo "Offline identity: single-player, multiplayer and LAN all work."
            echo
            echo "| Part | Source |"
            echo "|---|---|"
            echo "| Launcher | built from upstream nightly-source \`${NIGHTLY_COMMIT:0:7}\` + the offline account patch |"
            echo "| Game | official nightly \`${NIGHTLY_COMMIT:0:7}\` (installed as \`${VERSION_TAG%-offline}\`), copied verbatim |"
            echo "| Patch | offline names, no account needed, multiplayer/LAN unlocked, no self-update |"
            echo
            echo "Unzip, run \`./horizon-launcher\`. The bundled game build installs itself on first start."
            echo
            echo "Change your name in **Settings → Account → Play offline**, or:"
            echo
            echo '```'
            echo "./horizon-launcher account offline YourName"
            echo '```'
            echo
            echo "No Microsoft account is needed and no account session is ever read. Servers with"
            echo "\`online-mode=true\` still reject offline identities, as in other offline builds."
          } > release-notes-offline.md

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET=$(find package -maxdepth 1 -name '*.tar.gz' | head -1)
          [[ -n "$ASSET" ]] || { echo '::error::no package produced'; exit 1; }
          gh release create "$VERSION_TAG" "$ASSET" \
            --title "Horizon offline · $VERSION_TAG" \
            --notes-file release-notes-offline.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horizon-offline-${{ env.VERSION_TAG }}
          path: |
            package/
            release-notes-offline.md
          retention-days: 14
          if-no-files-found: warn
