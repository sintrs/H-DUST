name: Build Linux for glibc 2.28 (UOS 20 / Debian 10)

# 手动触发：Actions → 这个 workflow → Run workflow。产物在本次运行的 Artifacts 里。
#
# 这个仓库不托管 Horizon 的源码：workflow 自己去公开仓库克隆，编完只上传二进制。
# 仓库里只需要 tools/ci/ 的几个脚本 + 这一个 workflow 文件。
#
# 为什么是两路源码：
#   · 游戏本体用 horizon-rust/horizon（真上游，最新引擎）；
#   · 启动器用 gerdaroot 的离线分支 —— 上游 0.2.79 已经把"离线身份"整个删掉了
#     （account.rs 只剩 old_offline 的只读兼容），没有正版账号就进不去；
#     离线分支保留了 GATE_OPEN，可以无账号开局。
#
# 为什么不用 Horizon 自带的 launcher.yml / game-build.yml：
#   · 它们跑在 ubuntu-22.04 上，产物要 GLIBC_2.35，UOS 20（2.28）加载不了；
#   · 它们会去改原仓库的 release，在你的仓库里必然失败。
# 这里只在 Debian 10 容器里编译，不发 release、不碰 secret。

on:
  workflow_dispatch:
    inputs:
      game_repo:
        description: '游戏源码（默认真上游）'
        required: false
        default: horizon-rust/horizon
        type: string
      game_ref:
        description: '游戏源码的分支/tag/commit（留空 = 默认分支）'
        required: false
        default: ''
        type: string
      launcher_repo:
        description: '启动器源码（默认带离线门禁的分支）'
        required: false
        default: gerdaroot/Horizon-Offline-Launcher
        type: string
      targets:
        description: '编译哪些目标'
        required: false
        default: both
        type: choice
        options: [both, launcher, game]
      target_cpu:
        description: 'CPU 基线：x86-64（通用）/ x86-64-v3（AVX2，KX-7000 可用）'
        required: false
        default: x86-64
        type: choice
        options: [x86-64, x86-64-v3]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: 腾出磁盘（Rust 大项目编译产物很大）
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: 取游戏源码
        if: inputs.targets != 'launcher'
        run: |
          REF="${{ inputs.game_ref }}"
          if [[ -n "$REF" ]]; then
            git clone --depth 1 --no-tags --branch "$REF" "https://github.com/${{ inputs.game_repo }}.git" game-src \
              || { git clone --no-tags "https://github.com/${{ inputs.game_repo }}.git" game-src && git -C game-src checkout "$REF"; }
          else
            git clone --depth 1 --no-tags "https://github.com/${{ inputs.game_repo }}.git" game-src
          fi
          echo "游戏源码：$(git -C game-src log -1 --format='%h %ad %s' --date=short)"
          echo "工作树：$(du -sh game-src | cut -f1)"
          # 布局自检：上游有 crates/horizon-official；离线分支没有（游戏入口直接叫 horizon-client）
          if [[ -d game-src/crates/horizon-official ]]; then
            echo "布局：upstream（游戏入口 horizon-official → 打包时改名 horizon-client）"
          else
            echo "布局：legacy（游戏入口直接是 horizon-client）"
          fi

      - name: 取启动器源码
        if: inputs.targets != 'game'
        run: |
          git clone --depth 1 --no-tags "https://github.com/${{ inputs.launcher_repo }}.git" launcher-src
          echo "启动器源码：$(git -C launcher-src log -1 --format='%h %ad %s' --date=short)"
          # 离线门禁自检：这个常量决定"没有正版账号能不能开局"
          if grep -rq 'GATE_OPEN: bool = true' launcher-src/launcher/src/account.rs 2>/dev/null; then
            echo "离线门禁：开启（GATE_OPEN = true）"
          else
            echo "::warning::启动器源码里没有 GATE_OPEN = true，没有正版账号将无法开局"
          fi

      - name: 确认构建环境
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          echo "宿主 glibc $(ldd --version | head -1 | awk '{print $NF}')（只用于跑容器，产物取决于容器）"

      - name: 编译启动器
        if: inputs.targets != 'game'
        env:
          RUSTFLAGS: -C target-cpu=${{ inputs.target_cpu }}
        run: bash tools/ci/build-glibc228.sh launcher-src dist launcher

      - name: 编译游戏二进制（client / ctl / prepare / server + wasm-std）
        if: inputs.targets != 'launcher'
        env:
          RUSTFLAGS: -C target-cpu=${{ inputs.target_cpu }}
        run: bash tools/ci/build-glibc228.sh game-src dist game

      - name: 装进官方包（骨架 = 上游 nightly，只换受 glibc 影响的二进制）
        if: inputs.targets != 'launcher'
        run: |
          bash tools/ci/make-uos-package.sh dist package \
            "https://github.com/horizon-rust/horizon/releases/download/nightly/horizon-linux-x86_64.tar.gz"

      - name: 汇总结果
        if: always()
        run: |
          {
            echo "## 产物（glibc 上限判定）"
            echo
            echo "| 文件 | 需要的最高 GLIBC | 大小 | 结论 |"
            echo "|---|---|---|---|"
            for f in dist/* package/*.tar.gz; do
              [[ -f "$f" ]] || continue
              case "$f" in
                *.tar.gz) echo "| \`$(basename "$f")\` | — | $(du -h "$f" | cut -f1) | 完整包 |"; continue ;;
              esac
              v=$(objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
              if [[ -z "$v" ]]; then r="非 ELF / 无法判定"; \
              elif [[ "$(printf '%s\n2.28\n' "${v#GLIBC_}" | sort -V | tail -1)" == "2.28" ]]; then r="可在 UOS 20 运行"; \
              else r="**超过 2.28，UOS 加载不了**"; fi
              echo "| \`$(basename "$f")\` | ${v:-?} | $(du -h "$f" | cut -f1) | $r |"
            done
            echo
            echo "游戏源码：\`${{ inputs.game_repo }}\` @ \`${{ inputs.game_ref || 'default' }}\` · 启动器：\`${{ inputs.launcher_repo }}\`"
            echo
            echo "CPU 基线：\`${{ inputs.target_cpu }}\`。指令集判据是 POPCNT/LZCNT（上游 tools/check_cpu_baseline.py），"
            echo "不是「有没有 AVX-512」—— AVX/FMA 一律在 CPUID 检查之后执行，数它们只会误报。"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-glibc228-${{ inputs.target_cpu }}
          path: |
            dist/
            package/
          if-no-files-found: error
          retention-days: 30
